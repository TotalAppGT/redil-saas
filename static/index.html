<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDIL - Sistema de Gestión Eclesiástica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a2a3a;min-height:100vh}
/* Login */
.login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2844 0%,#1a3a5c 50%,#2a5a8c 100%)}
.login-card{background:rgba(255,255,255,.97);border-radius:24px;padding:48px 40px;width:400px;max-width:92%;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.login-card h1{font-size:28px;font-weight:800;color:#0f2844;margin-bottom:4px}
.login-card .sub{color:#6b7a8a;font-size:14px;margin-bottom:32px}
.login-card label{font-size:13px;font-weight:600;color:#4a5a6a;display:block;margin-bottom:6px}
.login-card input{width:100%;padding:12px 16px;border:2px solid #e2e6ea;border-radius:12px;font-size:15px;transition:border .2s;margin-bottom:20px;outline:none}
.login-card input:focus{border-color:#1a3a5c}
.login-card button{width:100%;padding:14px;background:#0f2844;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.login-card button:hover{background:#1a3a5c}
.login-card .error{color:#dc3545;font-size:13px;margin-top:12px;display:none}
/* Dashboard */
.dashboard{display:none;min-height:100vh}
.sidebar{width:260px;background:#0f2844;color:#fff;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar .logo{padding:24px 20px;font-size:20px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .logo span{color:#5a9fd4}
.sidebar nav{padding:12px 0}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;border-left:3px solid transparent}
.sidebar nav a:hover,.sidebar nav a.active{color:#fff;background:rgba(255,255,255,.08);border-left-color:#5a9fd4}
.main{margin-left:260px;padding:24px 32px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.topbar h2{font-size:24px;font-weight:700}
.topbar .user-info{display:flex;align-items:center;gap:12px;font-size:14px;color:#6b7a8a}
.topbar .user-info .logout{color:#dc3545;cursor:pointer;font-weight:600;font-size:13px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat-card .label{font-size:13px;color:#6b7a8a;font-weight:500;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:800;color:#0f2844}
.stat-card .value.green{color:#1e7e34}
.stat-card .value.orange{color:#e67e22}
.stat-card .value.red{color:#c0392b}
/* Responsive */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  .menu-toggle{display:block!important;background:none;border:none;font-size:24px;cursor:pointer;color:#0f2844}
}
.menu-toggle{display:none}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="login-container" id="loginView">
  <div class="login-card">
    <h1>REDIL</h1>
    <div class="sub">Sistema de Gestión Eclesiástica</div>
    <label>Correo electrónico</label>
    <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" value="totalappgt@gmail.com">
    <label>Contraseña</label>
    <input type="password" id="loginPass" placeholder="••••••••" value="admintotal">
    <button onclick="login()">Iniciar sesión</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardView">
  <aside class="sidebar" id="sidebar">
    <div class="logo">R<span>E</span>DIL</div>
    <nav>
      <a href="#" class="active" onclick="showView('dashboard')">📊 Dashboard</a>
      <a href="#" onclick="showView('reportes')">📋 Reportes</a>
      <a href="#" onclick="showView('hermanos')">👥 Hermanos</a>
      <a href="#" onclick="showView('seguimientos')">📌 Seguimientos</a>
      <a href="#" onclick="alert('Configuración - próximamente')">⚙️ Configuración</a>
    </nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h2 id="viewTitle">Dashboard</h2>
      <div class="user-info">
        <span id="userName">—</span>
        <span class="logout" onclick="logout()">Cerrar sesión</span>
      </div>
    </div>
    <div id="viewContent"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('token');
let user = JSON.parse(localStorage.getItem('user') || '{}');

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API}${path}`, { ...opts, headers });
  if (!res.ok) throw new Error((await res.json()).detail || 'Error');
  return res.json();
}

async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPass').value;
  try {
    const res = await api('/api/auth/login', {
      method: 'POST', body: JSON.stringify({ email, password })
    });
    token = res.token; user = res.usuario;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    showDashboard();
  } catch (e) { showError(e.message); }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  token = null; user = {};
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('dashboardView').style.display = 'none';
}

async function showDashboard() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  document.getElementById('userName').textContent = user.nombre || user.email;
  await loadDashboard();
}

async function loadDashboard() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Dashboard';
  try {
    const res = await api('/api/reportes/resumen');
    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Reportes</div><div class="value">${res.total}</div></div>
        <div class="stat-card"><div class="label">Asistencia Total</div><div class="value green">${res.asistencia}</div></div>
        <div class="stat-card"><div class="label">Ofrenda Total</div><div class="value">Q${res.ofTotal.toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">Pendientes</div><div class="value red">${res.pendientes}</div></div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:32px;text-align:center;color:#6b7a8a">
        <div style="font-size:48px;margin-bottom:16px">🎉</div>
        <h3 style="color:#0f2844;margin-bottom:8px">REDIL v7.0 — SaaS</h3>
        <p>Bienvenido, ${user.nombre || user.email}. El sistema está listo.</p>
        <p style="margin-top:16px;font-size:13px">Agrega datos desde la sección Hermanos y Reportes.</p>
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div style="color:red">Error: ${e.message}</div>`;
  }
}

function showView(v) {
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  if (v === 'dashboard') loadDashboard();
  else if (v === 'hermanos') loadHermanos();
  else if (v === 'reportes') loadReportes();
  else if (v === 'seguimientos') loadSeguimientos();
}

async function loadHermanos() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Hermanos';
  try {
    const data = await api('/api/hermanos');
    el.innerHTML = `<div style="background:#fff;border-radius:16px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead><tr style="background:#0f2844;color:#fff">
          <th style="padding:12px 16px;text-align:left">Código</th>
          <th style="padding:12px 16px;text-align:left">Nombre</th>
          <th style="padding:12px 16px;text-align:left">Distrito</th>
          <th style="padding:12px 16px;text-align:left">Zona</th>
          <th style="padding:12px 16px;text-align:left">Pastor</th>
        </tr></thead>
        <tbody>
          ${data.length ? data.map(h => `<tr style="border-bottom:1px solid #f0f2f5">
            <td style="padding:12px 16px;font-weight:600">${h.codigo_lead}</td>
            <td style="padding:12px 16px">${h.nombre}</td>
            <td style="padding:12px 16px">${h.distrito}</td>
            <td style="padding:12px 16px">${h.zona}</td>
            <td style="padding:12px 16px">${h.pastor_zona || '—'}</td>
          </tr>`).join('') : '<tr><td colspan="5" style="padding:32px;text-align:center;color:#6b7a8a">Sin datos</td></tr>'}
        </tbody>
      </table>
    </div>`;
  } catch(e) { el.innerHTML = `<div style="color:red">Error: ${e.message}</div>`; }
}

async function loadReportes() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Reportes';
  try {
    const data = await api('/api/reportes');
    el.innerHTML = `<div style="background:#fff;border-radius:16px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#0f2844;color:#fff">
          <th style="padding:10px 12px;text-align:left">Fecha</th>
          <th style="padding:10px 12px;text-align:left">Líder</th>
          <th style="padding:10px 12px;text-align:left">Ofrenda</th>
          <th style="padding:10px 12px;text-align:left">Estado</th>
        </tr></thead>
        <tbody>
          ${data.length ? data.map(r => `<tr style="border-bottom:1px solid #f0f2f5">
            <td style="padding:10px 12px">${r.fecha}</td>
            <td style="padding:10px 12px;font-weight:600">${r.lider}</td>
            <td style="padding:10px 12px">Q${(r.ofrenda_total||0).toFixed(2)}</td>
            <td style="padding:10px 12px;color:${r.ofrenda_recibida==='SI'?'#1e7e34':'#c0392b'}">${r.ofrenda_recibida||'Pendiente'}</td>
          </tr>`).join('') : '<tr><td colspan="4" style="padding:32px;text-align:center;color:#6b7a8a">Sin datos</td></tr>'}
        </tbody>
      </table>
    </div>`;
  } catch(e) { el.innerHTML = `<div style="color:red">Error: ${e.message}</div>`; }
}

async function loadSeguimientos() {
  const el = document.getElementById('viewContent');
  document.getElementById('viewTitle').textContent = 'Seguimientos';
  try {
    const data = await api('/api/seguimientos');
    el.innerHTML = `<div style="background:#fff;border-radius:16px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#0f2844;color:#fff">
          <th style="padding:10px 12px;text-align:left">Persona</th>
          <th style="padding:10px 12px;text-align:left">Tipo</th>
          <th style="padding:10px 12px;text-align:left">Estado</th>
          <th style="padding:10px 12px;text-align:left">Responsable</th>
        </tr></thead>
        <tbody>
          ${data.length ? data.map(s => `<tr style="border-bottom:1px solid #f0f2f5">
            <td style="padding:10px 12px;font-weight:600">${s.persona}</td>
            <td style="padding:10px 12px">${s.tipo}</td>
            <td style="padding:10px 12px">${s.estado}</td>
            <td style="padding:10px 12px">${s.responsable||'—'}</td>
          </tr>`).join('') : '<tr><td colspan="4" style="padding:32px;text-align:center;color:#6b7a8a">Sin datos</td></tr>'}
        </tbody>
      </table>
    </div>`;
  } catch(e) { el.innerHTML = `<div style="color:red">Error: ${e.message}</div>`; }
}

// Auto-login si hay token
if (token) showDashboard();
</script>
</body>
</html>
